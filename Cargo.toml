[package]
name = "slashbuilder-identity-kit"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
description = "Account, family-graph and OIDC authentication primitives for the SlashBuilder Kit ecosystem"
repository = "https://github.com/slash-builder/identity-kit"
license = "Apache-2.0"
readme = "README.md"
keywords = ["identity", "auth", "oidc", "keycloak", "pkce"]
categories = ["authentication", "api-bindings"]
# An allow-list, not an exclude: nothing but the library, the docs and the licence can ship by accident.
include = ["/src/", "/README.md", "/LICENSE", "/CHANGELOG.md"]

# The library keeps the name `identity_kit` so `use identity_kit::...` is unchanged for every Kit that imports it; only
# the published package name carries the `slashbuilder-` prefix (the plain `identity-kit` is taken on crates.io).
[lib]
name = "identity_kit"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
oauth2 = { version = "4", default-features = false }
# Only `jsonwebtoken::dangerous::insecure_decode` is used (it reads claims without verifying anything), so NO crypto backend is
# selected: jsonwebtoken 10 makes the choice yours, and both options cost something we do not need here. `rust_crypto` pulls in
# `rsa` (RUSTSEC-2023-0071, no fix), `aws_lc_rs` needs a C toolchain. Do not call `decode`, `encode` or anything that signs or
# verifies without adding a backend (and revisiting this): with none selected those panic at run time. 10.3 is the first release
# with the exp/nbf type-confusion fix; `dangerous::insecure_decode` needs 10.1. `default-features = false` also drops PEM parsing.
jsonwebtoken = { version = "10.3", default-features = false }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt", "macros", "sync"] }
thiserror = "2.0"
uuid = { version = "1", features = ["serde", "v4"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
pretty_assertions = "1.4"
wiremock = "0.6"
# Test tokens are assembled by hand (the Kit never verifies a signature), so no jsonwebtoken backend is needed here.
base64 = "0.22"
# Conformance gate: imports the frozen `conformance::{Case, run_suite}` harness from crates.io
# (`slashbuilder-spec-kit`; the library is still imported as `spec_kit`). Locks the capability/principal invariants.
slashbuilder-spec-kit = "0.1"
